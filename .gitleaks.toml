title = "Hydromancer publication safeguards"

[extend]
useDefault = true

# Do not allowlist entire tests, notebooks, or templates: they can leak real keys.
[[rules]]
id = "wallet-hex-signing-key"
description = "Wallet private/signing key encoded as hex"
regex = '''(?i)(?:private[_-]?key|secret[_-]?key|wallet[_-]?secret|signing[_-]?key)[\w\s"'\\:=.-]{0,40}(?:0x)?([a-f0-9]{64}|[a-f0-9]{128})\b'''
secretGroup = 1
keywords = ["private", "secret", "signing"]

[[rules]]
id = "wallet-base58-signing-key"
description = "Wallet secret/keypair encoded as base58"
regex = '''(?i)(?:private[_-]?key|secret[_-]?key|wallet[_-]?secret|signing[_-]?key|keypair)[\w\s"'\\:=.-]{0,40}([1-9A-HJ-NP-Za-km-z]{80,90})\b'''
secretGroup = 1
keywords = ["private", "secret", "signing", "keypair"]

[[rules]]
id = "solana-keypair-byte-array"
description = "64-byte Solana-style signing key array"
regex = '''\[\s*(?:[0-9]{1,3}\s*,\s*){63}[0-9]{1,3}\s*\]'''

[[rules]]
id = "wallet-recovery-phrase"
description = "Assigned wallet seed/recovery phrase of 12 or more words"
regex = '''(?i)(?:mnemonic|seed[_ -]?phrase|recovery[_ -]?phrase)[\s"'\\:=]{1,16}((?:[a-z]{3,8}[ ]+){11,23}[a-z]{3,8})'''
secretGroup = 1
keywords = ["mnemonic", "seed", "recovery"]

[[rules]]
id = "hydromancer-or-copilot-token"
description = "Assigned Hydromancer API key or Colosseum PAT"
regex = '''(?i)(?:hydromancer_api_key|colosseum_copilot_pat)[\s"'\\:=]{1,16}([a-z0-9_./+~-]{20,}={0,2})'''
secretGroup = 1
entropy = 3.5
keywords = ["hydromancer_api_key", "colosseum_copilot_pat"]

[[rules.allowlists]]
description = "Exact non-secret placeholder used in the README, including history"
regexTarget = "secret"
regexes = ['''^replace-with-your-api-key$''']

[[rules]]
id = "token-bearing-url"
description = "Credential embedded in a URL query string"
regex = '''[?&](?:token|api_key|apikey|access_token)=([A-Za-z0-9_./+~%-]{20,}={0,2})'''
secretGroup = 1
entropy = 3.5
keywords = ["token=", "api_key=", "apikey=", "access_token="]

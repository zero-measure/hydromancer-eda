name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks and scan history
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          curl --fail --silent --show-error --location "$base/$archive" --output "$archive"
          curl --fail --silent --show-error --location \
            "$base/gitleaks_${version}_checksums.txt" --output checksums.txt
          grep -F " $archive" checksums.txt | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --log-opts="--all --full-history" \
            --redact=100 --ignore-gitleaks-allow --no-banner
